[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyesrgan"
version = "0.1.0"
description = "Real-ESRGAN super-resolution in tinygrad"
readme = "AGENTS.md"
requires-python = ">=3.10"
dependencies = [
    "tinygrad",
    "safetensors",
    "pillow",
    "numpy",
]

[project.scripts]
tinyesrgan = "tinyesrgan:main"

[tool.setuptools]
py-modules = ["tinyesrgan"]
packages = ["src"]

